[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-for-smes"
version = "0.1.0"
description = "Memory forensics helper for small and medium enterprises."
readme = "README.txt"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "volatility3>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
vol-for-smes = "vol_for_smes.gui.app:main"
vol-for-smes-cli = "vol_for_smes.main:main"

[tool.setuptools.packages.find]
include = ["vol_for_smes*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"vol_for_smes.analysis" = ["*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "integration: tests that run real Volatility commands against a memory image",
]
